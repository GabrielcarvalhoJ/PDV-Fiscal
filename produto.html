<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Cadastro de Produto</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<nav class="menu">
  <a href="index.html">Login</a>
  <a href="produto.html">Cadastro de Produto</a>
  <a href="venda.html">Tela de Vendas</a>
  <a href="estoque.html">Controle de Estoque</a>
</nav>

  <div class="login-container">
    <h2>Cadastro de Produto</h2>
    <form id="form-produto">
      <input type="text" id="nome" placeholder="Nome do produto" required />
      <input type="text" id="codigo" placeholder="Código" required />
      <input type="number" id="preco" placeholder="Preço (R$)" step="0.01" required />
      <input type="number" id="quantidade" placeholder="Quantidade" min="1" required />
      <input type="text" id="categoria" placeholder="Categoria" required />
      <select id="tipo" required>
        <option value="">Tipo</option>
        <option value="produto">Produto</option>
        <option value="servico">Serviço</option>
      </select>
      <button type="submit">Cadastrar</button>
    </form>
    <h3>Produtos Cadastrados</h3>
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Preço</th>
          <th>Quantidade</th>
          <th>Categoria</th>
          <th>Tipo</th>
        </tr>
      </thead>
      <tbody id="tabela-produtos"></tbody>
    </table>
  </div>
  <script>
    const form = document.getElementById("form-produto");
    const tabela = document.getElementById("tabela-produtos");
    function salvarProduto(produto) {
      const lista = JSON.parse(localStorage.getItem("produtos") || "[]");
      lista.push(produto);
      localStorage.setItem("produtos", JSON.stringify(lista));
    }
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const produto = {
        nome: nome.value,
        codigo: codigo.value,
        preco: parseFloat(preco.value),
        quantidade: parseInt(quantidade.value),
        categoria: categoria.value,
        tipo: tipo.value,
      };
      salvarProduto(produto);
      form.reset();
      carregarTabela();
    });
    function carregarTabela() {
      const lista = JSON.parse(localStorage.getItem("produtos") || "[]");
      tabela.innerHTML = "";
      lista.forEach((p) => {
        const linha = document.createElement("tr");
        linha.innerHTML = `
          <td>${p.nome}</td>
          <td>R$ ${p.preco.toFixed(2)}</td>
          <td>${p.quantidade}</td>
          <td>${p.categoria}</td>
          <td>${p.tipo}</td>`;
        tabela.appendChild(linha);
      });
    }
    carregarTabela();
  </script>
</body>
</html>
